[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "reasonledger-mcp"
version = "0.3.0a8"
description = "ReasonLedger MCP server — vendor-neutral decision capture"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SphotaLabs Inc." }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.27,<2",
    "reasonledger-core==0.3.0a8",
    # mcp needs pyjwt[crypto]; cryptography 49+ ships no Intel macOS wheel, so an install there
    # builds it from source and fails without Rust 1.83+. 48.x still has the wheel.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.urls]
Homepage = "https://github.com/Sphotalabs-Inc/ReasonLedger"
Repository = "https://github.com/Sphotalabs-Inc/ReasonLedger"
Issues = "https://github.com/Sphotalabs-Inc/ReasonLedger/issues"

[project.scripts]
reasonledger-mcp = "reasonledger_mcp.server:main"

[tool.uv.sources]
reasonledger-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/reasonledger_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
