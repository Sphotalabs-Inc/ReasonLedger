[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "reasonledger"
version = "0.3.0a8"
description = "Never lose the why behind AI-written code — decision capture, review, and policy checks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SphotaLabs Inc." }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "reasonledger-core==0.3.0a8",
    "reasonledger-mcp==0.3.0a8",
]

[project.optional-dependencies]
embeddings = [
    "reasonledger-core[embeddings]==0.3.0a8",
]

[project.urls]
Homepage = "https://github.com/Sphotalabs-Inc/ReasonLedger"
Repository = "https://github.com/Sphotalabs-Inc/ReasonLedger"
Issues = "https://github.com/Sphotalabs-Inc/ReasonLedger/issues"

[project.scripts]
reasonledger = "reasonledger_cli.main:main"
rl = "reasonledger_cli.main:main"

[tool.uv.sources]
reasonledger-core = { workspace = true }
reasonledger-mcp = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/reasonledger_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
